name: Verify research terminal
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      QUANT_DATA_OFFLINE: '1'
      QUANT_AUTOMATION_SCHEDULER_ENABLED: '0'
      QUANT_WARM_MARKET_CACHE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --python 3.12
        working-directory: backend
      - run: uv run --locked pytest -q
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run api:check && npm run lint && npm test && npm run build
        working-directory: frontend
      - run: uv run --locked pip-audit --disable-pip --no-deps -r requirements.txt
        working-directory: backend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
