[project]
name = "momo-quant"
version = "3.0.0"
description = "Local daily-bar quantitative research terminal"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.143,<0.144", "uvicorn>=0.39,<0.40", "pydantic>=2.13.3,<3",
 "pandas>=2.3.3,<3", "numpy>=2.2,<2.3", "scipy>=1.15,<1.16",
 "scikit-learn>=1.6.1,<1.7", "pyarrow>=23.0.1,<24", "joblib>=1.5.3,<2",
 "akshare>=1.18.56,<1.19", "baostock>=0.9.1,<0.10", "requests>=2.32.5,<3",
 "httpx>=0.28.1,<0.29", "starlette>=1.3.1,<2",
]

[dependency-groups]
dev = ["pytest>=8.4.2,<9", "pip-audit>=2.9,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
